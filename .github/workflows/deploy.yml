name: deploy

# Stage-first ship for the app + engine.
#
#   repository_dispatch (prayer-earth CI green on main)  →  STAGING, automatically.
#   workflow_dispatch with target=production             →  production, deliberately.
#   workflow_dispatch with target=staging                →  staging, by hand.
#
# Why: every green push used to auto-ship production. CI stops code that fails
# its tests, but nothing stops code that passes tests and still breaks at
# runtime — so a mid-development mistake reached real users on every push. Now a
# push lands on staging.joining-palms.app (own Worker, own Durable Object
# namespace, isolated storage), you verify it there, and production changes only
# when you promote it. Production keeps the previous deploy's rollback safety
# net either way.
#
# Promote: gh workflow run deploy --repo Jiansorge/sync-engine -f target=production
#
# Required repo secrets:
#   DEPLOY_PAT            — a fine-grained PAT with Contents:read AND Statuses:write
#                           on Jiansorge/prayer-earth. Statuses:write is what lets
#                           this workflow report the deploy outcome back onto the
#                           commit that triggered it; without it the status step
#                           is skipped with a warning and the deploy is unaffected.
#   CLOUDFLARE_API_TOKEN  — Cloudflare token with Workers Scripts:Edit + Workers Routes:Edit + Zone:Cache Purge
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
#   CF_API_TOKEN          — optional, SEPARATE zone-scoped token with Zone>Cache>Purge
#                           (purge is a no-op on staging; production only).
on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      # A push dispatch always means staging. A manual run means whatever the
      # operator chose. Computed once and passed through every later step so the
      # deploy, the verify gate, the rollback path and the commit status can
      # never disagree about which environment they are touching.
      - name: Resolve the target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "Deploying to staging (stage-first: production is promoted separately)"
          else
            echo "name=${{ inputs.target || 'staging' }}" >> "$GITHUB_OUTPUT"
            echo "Deploying to ${{ inputs.target || 'staging' }}"
          fi

      - name: Checkout sync-engine
        uses: actions/checkout@v7
        with:
          path: sync-engine

      - name: Checkout prayer-earth (sibling, as deploy-app expects)
        uses: actions/checkout@v7
        with:
          repository: Jiansorge/prayer-earth
          path: prayer-earth
          token: ${{ secrets.DEPLOY_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sync-engine/package-lock.json
            prayer-earth/package-lock.json

      - name: Install sync-engine deps
        working-directory: sync-engine
        run: npm ci --legacy-peer-deps

      - name: Install prayer-earth deps
        working-directory: prayer-earth
        run: npm ci --legacy-peer-deps

      # Mark the triggering commit as deploying before any work starts. Without
      # this the commit sits green until the whole run finishes, so a five
      # minute deploy is indistinguishable from no deploy at all.
      - name: Mark the prayer-earth commit as deploying
        if: github.event.client_payload.sha
        working-directory: sync-engine
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
          TARGET_RUN_ID: ${{ github.event.client_payload.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_TARGET: ${{ steps.target.outputs.name }}
          # The ACCOUNT-scoped token, not CF_API_TOKEN. Naming the live version
          # means reading Workers deployments, which lives at account scope; the
          # zone-scoped token gets a 403 there and the status falls back to
          # "staging deployed" with no version in it.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/report-deploy-status.mjs

      # The real work. --env=staging selects the [env.staging] Worker, its own
      # Durable Object namespace and its reduced binding set (no TOTALS_BACKUP
      # KV — staging's world is disposable). Omitting the flag deploys
      # production, including its version-contract gate, rollback-on-failure and
      # (production-only) edge-cache purge.
      - name: Ship (tests → build app → stage → deploy → verify)
        id: ship
        working-directory: sync-engine
        env:
          # CF_API_TOKEN: a SEPARATE, zone-scoped token with Zone>Cache>Purge
          # (the account-scoped CLOUDFLARE_API_TOKEN below cannot purge). If
          # unset, the purge is skipped with a warning (non-fatal).
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-app.mjs --no-auth --env=${{ steps.target.outputs.name }}

      # Runs whether or not the ship step succeeded, because a failed deploy is
      # exactly the case this exists to surface. report-deploy-status.mjs exits 0
      # on every path, so this cannot turn a failed deploy into a failed report
      # and hide the original error behind a new one.
      - name: Report the outcome on the prayer-earth commit
        if: always() && github.event.client_payload.sha
        working-directory: sync-engine
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
          TARGET_RUN_ID: ${{ github.event.client_payload.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHIP_CONCLUSION: ${{ steps.ship.conclusion }}
          DEPLOY_TARGET: ${{ steps.target.outputs.name }}
          # Account-scoped, for the same reason as above: the live version id
          # comes from the deployments endpoint, which the zone token cannot
          # read.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/report-deploy-status.mjs
