name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry once for npm optional-bindings bug)
        run: |
          npm ci --legacy-peer-deps || {
            echo "::warning::npm ci failed - clearing node_modules and retrying"
            rm -rf node_modules
            npm ci --legacy-peer-deps
          }
      - name: Protocol + DO integration tests
        run: npm test