name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check /health and /stats
        id: health
        run: |
          health_body=$(curl -s --max-time 15 https://joining-palms.app/health)
          stats_body=$(curl -s --max-time 15 https://joining-palms.app/stats)
          ok="no"
          detail=""
          # jq fails on non-JSON (e.g. SPA HTML from the assets fallback) — which
          # is precisely the Worker-vs-assets routing fault we guard against.
          if echo "$health_body" | jq -e '.ok == true' >/dev/null 2>&1; then
            if echo "$stats_body" | jq -e '(.errors // 0) == 0' >/dev/null 2>&1; then
              ok="yes"
            else
              detail="stats errors=$(echo "$stats_body" | jq -r '.errors // "bad-json"' 2>/dev/null)"
            fi
          else
            detail="health not Worker JSON (assets fallback?) $(echo "$health_body" | head -c 120)"
          fi
          echo "ok=$ok"
          echo "detail=$detail"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: WebSocket smoke (upgrade must 101, not assets HTML)
        id: ws
        run: |
          output=$(node scripts/smoke-ws.mjs wss://joining-palms.app 2>&1 || true)
          echo "$output"
          ok="no"
          if echo "$output" | grep -q "SMOKE OK"; then ok="yes"; fi
          echo "ws_ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Version-contract check (live Worker carries handlers + bindings)
        id: contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "contract check skipped (no CLOUDFLARE_API_TOKEN secret)"
            echo "contract_ok=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          output=$(node scripts/verify-version.mjs 2>&1)
          echo "$output"
          if echo "$output" | grep -q "contract OK"; then
            echo "contract_ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "contract_ok=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if down, degraded, or WS broken (deduped)
        if: steps.health.outputs.ok == 'no' || steps.ws.outputs.ws_ok == 'no' || steps.contract.outputs.contract_ok == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          detail="${{ steps.health.outputs.detail }}"
          if [ "${{ steps.ws.outputs.ws_ok }}" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; websocket smoke failed"; else detail="websocket smoke failed"; fi
          fi
          if [ "${{ steps.contract.outputs.contract_ok }}" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; live version violates Worker contract"; else detail="live version violates Worker contract"; fi
          fi
          exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$exists" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Uptime: joining-palms.app health check failing" \
              --label uptime \
              --body "Check failed at $(date -u): $detail. Investigate: /health, /stats, WebSocket handshake, wrangler tail, DO status."
          else
            echo "open issue #$exists already exists"
          fi
