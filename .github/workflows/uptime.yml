name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check /health and /stats
        id: health
        run: |
          # curl's own transport failure (connection refused, DNS dead,
          # timeout) must become DATA, not a dead step: GitHub runs run:
          # steps under `bash -e`, and the unguarded `body=$(curl ...)`
          # aborted there — so the most severe outages produced a red Actions
          # run and NO issue, while the milder "200 with wrong body" case did
          # alert. Capture the exit code and turn it into detail below.
          hcode=0
          health_body=$(curl -s --max-time 15 https://joining-palms.app/health) || hcode=$?
          scode=0
          stats_body=$(curl -s --max-time 15 https://joining-palms.app/stats) || scode=$?
          # detail travels through GITHUB_OUTPUT: keep it single-line or the
          # output file parse breaks on embedded newlines from an HTML body.
          detail=""
          ok="no"
          if [ "$hcode" -ne 0 ]; then
            detail="health unreachable (curl exit $hcode)"
          elif echo "$health_body" | jq -e '.ok == true' >/dev/null 2>&1; then
            if [ "$scode" -ne 0 ]; then
              detail="stats unreachable (curl exit $scode)"
            elif echo "$stats_body" | jq -e '(.errors // 0) == 0' >/dev/null 2>&1; then
              ok="yes"
            else
              detail="stats errors=$(echo "$stats_body" | jq -r '.errors // "bad-json"' 2>/dev/null)"
            fi
          else
            detail="health not Worker JSON (assets fallback?) $(echo "$health_body" | head -c 120)"
          fi
          detail=$(printf '%s' "$detail" | tr '\n' ' ')
          echo "ok=$ok"
          echo "detail=$detail"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: WebSocket smoke (upgrade must 101, not assets HTML)
        id: ws
        run: |
          output=$(node scripts/smoke-ws.mjs wss://joining-palms.app 2>&1 || true)
          echo "$output"
          ok="no"
          if echo "$output" | grep -q "SMOKE OK"; then ok="yes"; fi
          echo "ws_ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Version-contract check (live Worker carries handlers + bindings)
        id: contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "contract check skipped (no CLOUDFLARE_API_TOKEN secret)"
            echo "contract_ok=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true`: a crashing verifier (bad node, missing secret handling)
          # must not abort the step under `bash -e` — same rule as the health
          # step: monitoring failures become issue text, never a dead run.
          output=$(node scripts/verify-version.mjs 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q "contract OK"; then
            echo "contract_ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "contract_ok=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if down, degraded, or WS broken (deduped)
        if: steps.health.outputs.ok == 'no' || steps.ws.outputs.ws_ok == 'no' || steps.contract.outputs.contract_ok == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass step outputs through the environment, never interpolate them
          # into the run: script text — `detail` embeds the remote /health body,
          # so direct interpolation is a script-injection sink.
          HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
          WS_OK: ${{ steps.ws.outputs.ws_ok }}
          CONTRACT_OK: ${{ steps.contract.outputs.contract_ok }}
        run: |
          detail="$HEALTH_DETAIL"
          if [ "$WS_OK" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; websocket smoke failed"; else detail="websocket smoke failed"; fi
          fi
          if [ "$CONTRACT_OK" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; live version violates Worker contract"; else detail="live version violates Worker contract"; fi
          fi
          # Create the label before using it. `gh issue create --label uptime`
          # FAILS when the label does not exist, and that failure is the whole
          # step - so the alert was silently lost. It was: the label was never
          # created on the repo, which is why every failing run between 2026-10-13
          # and 2026-10-14 produced a bare Actions failure email and no issue at
          # all. A monitoring path that depends on a human having set a label up
          # first is a monitoring path that does not exist.
          gh label create uptime --repo "$GITHUB_REPOSITORY" \
            --color D93F0B --description "Automated health-check failure for joining-palms.app" 2>/dev/null || true
          exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$exists" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Uptime: joining-palms.app health check failing" \
              --label uptime \
              --body "Check failed at $(date -u): $detail. Investigate: /health, /stats, WebSocket handshake, wrangler tail, DO status."
          else
            echo "open issue #$exists already exists"
          fi

      # Close the issue once the site is healthy again. Without this the issue
      # stays open forever, and the dedupe above then means a SECOND outage
      # finds an existing issue, creates nothing, and sends no notification -
      # the exact window when the alert is most needed goes silent. A closed
      # issue on recovery is also what makes "open uptime issues" a signal a
      # human can trust instead of a permanently-red line.
      - name: Close the uptime issue on recovery
        if: steps.health.outputs.ok == 'yes' && steps.ws.outputs.ws_ok == 'yes' && steps.contract.outputs.contract_ok != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$exists" ]; then
            gh issue close "$exists" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered at $(date -u). All checks green: /health, /stats, WebSocket handshake, version contract. Closing so the next outage opens a fresh issue and notifies, instead of hiding behind this one." \
              && echo "closed issue #$exists"
          else
            echo "no open uptime issue - nothing to close"
          fi

      # Optional second alert leg, active only if the ALERT_WEBHOOK_URL repo
      # secret exists (ntfy.sh topic, Slack or Discord incoming webhook).
      # Deliberately skip-not-fail when unset: a monitoring path that can break
      # the check which found the outage is worse than having one alert channel.
      - name: Alert the webhook if down (optional)
        if: steps.health.outputs.ok == 'no' || steps.ws.outputs.ws_ok == 'no' || steps.contract.outputs.contract_ok == 'no'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Same injection rule as the issue step: the remote /health body goes
          # through the environment, never interpolated into run: script text.
          HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
          WS_OK: ${{ steps.ws.outputs.ws_ok }}
          CONTRACT_OK: ${{ steps.contract.outputs.contract_ok }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set - skipping the webhook leg (the GitHub issue above is still opened)"
            exit 0
          fi
          detail="$HEALTH_DETAIL"
          if [ "$WS_OK" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; websocket smoke failed"; else detail="websocket smoke failed"; fi
          fi
          if [ "$CONTRACT_OK" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; live version violates Worker contract"; else detail="live version violates Worker contract"; fi
          fi
          msg="DOWN joining-palms.app $(date -u): $detail - see https://github.com/$GITHUB_REPOSITORY/actions"
          # ntfy topic URLs take a plain-text body; Slack and Discord take JSON.
          # Sending both `text` (Slack) and `content` (Discord) keys means one
          # payload satisfies either, and the extra key is ignored by both.
          case "$ALERT_WEBHOOK_URL" in
            *ntfy.sh*)
              if curl -sS --max-time 15 -d "$msg" "$ALERT_WEBHOOK_URL" >/dev/null; then
                echo "ntfy alert sent"
              else
                echo "::warning::ntfy alert failed - the GitHub issue above is still open"
              fi
              ;;
            *)
              payload=$(jq -n --arg m "$msg" '{text: $m, content: $m}')
              if curl -sS --max-time 15 -H 'Content-Type: application/json' -d "$payload" "$ALERT_WEBHOOK_URL" >/dev/null; then
                echo "webhook alert sent"
              else
                echo "::warning::webhook alert failed - the GitHub issue above is still open"
              fi
              ;;
          esac

      # Tell the same channel the site is back, so a DOWN alert is never the
      # last message someone sees. Best-effort and silent when unset.
      - name: Notify the webhook on recovery (optional)
        if: steps.health.outputs.ok == 'yes' && steps.ws.outputs.ws_ok == 'yes' && steps.contract.outputs.contract_ok != 'no'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then exit 0; fi
          msg="UP joining-palms.app recovered at $(date -u) - all checks green"
          case "$ALERT_WEBHOOK_URL" in
            *ntfy.sh*) curl -sS --max-time 15 -d "$msg" "$ALERT_WEBHOOK_URL" >/dev/null || echo "::warning::ntfy recovery notice failed" ;;
            *) curl -sS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg m "$msg" '{text: $m, content: $m}')" "$ALERT_WEBHOOK_URL" >/dev/null || echo "::warning::webhook recovery notice failed" ;;
          esac
          echo "recovery notice sent"

  # Quiet staging watch. Staging (staging.joining-palms.app) is disposable and
  # re-deployed on every push, so this job is deliberately tamer than the
  # production one:
  #   - own `uptime-staging` label, so a staging hiccup never mixes into the
  #     production uptime signal;
  #   - no webhook leg — staging downtime must not page anyone (staging is
  #     expected to be briefly broken; that is what staging is for);
  #   - health + stats + WebSocket smoke only, no version-contract check
  #     (the deploy gate already verifies the contract on every deploy, and a
  #     contract secret here would just duplicate it on a 5-minute timer);
  #   - never fails the workflow. Every check failure is converted into an
  #     issue; the only red this job can show is its own infra breaking.
  # Its value: a deploy that rolled back or a Worker left wedged between
  # deploys is visible without anyone remembering to open the site.
  check-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check staging /health and /stats
        id: health
        run: |
          # Same transport rule as the production job: under `bash -e` an
          # unguarded curl failure kills the step before any issue is opened,
          # so capture the exit code as data.
          hcode=0
          health_body=$(curl -s --max-time 15 https://staging.joining-palms.app/health) || hcode=$?
          scode=0
          stats_body=$(curl -s --max-time 15 https://staging.joining-palms.app/stats) || scode=$?
          detail=""
          ok="no"
          if [ "$hcode" -ne 0 ]; then
            detail="health unreachable (curl exit $hcode)"
          elif echo "$health_body" | jq -e '.ok == true' >/dev/null 2>&1; then
            if [ "$scode" -ne 0 ]; then
              detail="stats unreachable (curl exit $scode)"
            elif echo "$stats_body" | jq -e '(.errors // 0) == 0' >/dev/null 2>&1; then
              ok="yes"
            else
              detail="stats errors=$(echo "$stats_body" | jq -r '.errors // "bad-json"' 2>/dev/null)"
            fi
          else
            detail="health not Worker JSON (assets fallback?) $(echo "$health_body" | head -c 120)"
          fi
          detail=$(printf '%s' "$detail" | tr '\n' ' ')
          echo "ok=$ok"
          echo "detail=$detail"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: WebSocket smoke (staging upgrade must 101, not assets HTML)
        id: ws
        run: |
          output=$(node scripts/smoke-ws.mjs wss://staging.joining-palms.app 2>&1 || true)
          echo "$output"
          ok="no"
          if echo "$output" | grep -q "SMOKE OK"; then ok="yes"; fi
          echo "ws_ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open staging issue if down (deduped)
        if: steps.health.outputs.ok == 'no' || steps.ws.outputs.ws_ok == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          # Injection rule as everywhere else: the remote body travels via env.
          HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
          WS_OK: ${{ steps.ws.outputs.ws_ok }}
        run: |
          detail="$HEALTH_DETAIL"
          if [ "$WS_OK" = "no" ]; then
            if [ -n "$detail" ]; then detail="$detail; websocket smoke failed"; else detail="websocket smoke failed"; fi
          fi
          # Create the label defensively — `gh issue create --label` FAILS when
          # the label is missing (that bug silently ate production alerts once).
          gh label create uptime-staging --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Automated health-check failure for staging.joining-palms.app (quiet - staging only)" 2>/dev/null || true
          exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime-staging --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$exists" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Uptime (staging): staging.joining-palms.app health check failing" \
              --label uptime-staging \
              --body "Staging check failed at $(date -u): $detail. Staging is disposable - check whether a deploy rolled back or the staging Worker is wedged: /health, /stats, WebSocket handshake, the latest deploy run. Production is unaffected unless it shows its own uptime issue." \
              || echo "::warning::staging issue create failed (staging down, but no issue was opened)"
          else
            echo "open staging issue #$exists already exists"
          fi

      - name: Close the staging issue on recovery
        if: steps.health.outputs.ok == 'yes' && steps.ws.outputs.ws_ok == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime-staging --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$exists" ]; then
            gh issue close "$exists" --repo "$GITHUB_REPOSITORY" \
              --comment "Staging recovered at $(date -u): /health, /stats and WebSocket handshake all green. Closing so the next staging outage opens a fresh issue instead of hiding behind this one." \
              && echo "closed staging issue #$exists" \
              || echo "::warning::staging issue close failed"
          else
            echo "no open staging issue - nothing to close"
          fi
